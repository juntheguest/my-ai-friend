<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>웬즈데이</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f4f4f5;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 760px;
      height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      box-shadow:
        0 0 30px rgba(0, 0, 0, 0.08);
    }

    .header {
      height: 64px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #eeeeee;
      background: #ffffff;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #171717;
      color: white;
      font-size: 15px;
      font-weight: 700;
    }

    .name {
      font-size: 15px;
      font-weight: 700;
      color: #222222;
    }

    .status {
      margin-top: 2px;
      font-size: 11px;
      color: #999999;
    }

    .affection {
      font-size: 11px;
      color: #999999;
      text-align: right;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 22px 16px 28px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      background: #f7f7f8;
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      justify-content: flex-start;
    }

    .bubble {
      max-width: min(78%, 560px);
      padding: 10px 13px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user .bubble {
      background: #222222;
      color: #ffffff;
      border-bottom-right-radius: 5px;
    }

    .assistant .bubble {
      background: #ffffff;
      color: #222222;
      border: 1px solid #eeeeee;
      border-bottom-left-radius: 5px;
    }

    .proactive-label {
      font-size: 10px;
      color: #aaaaaa;
      margin-left: 4px;
      margin-bottom: 3px;
    }

    .assistant-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .typing {
      display: none;
      align-items: center;
      gap: 4px;
      padding: 11px 14px;
      background: #ffffff;
      border: 1px solid #eeeeee;
      border-radius: 16px;
      border-bottom-left-radius: 5px;
    }

    .typing.show {
      display: flex;
    }

    .dot {
      width: 5px;
      height: 5px;
      background: #999999;
      border-radius: 50%;
      animation:
        blink 1.2s infinite ease-in-out;
    }

    .dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes blink {
      0%,
      60%,
      100% {
        opacity: 0.3;
      }

      30% {
        opacity: 1;
      }
    }

    .composer {
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 12px;
      background: #ffffff;
      border-top: 1px solid #eeeeee;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 42px;
      max-height: 130px;
      padding: 11px 13px;
      border: 1px solid #dddddd;
      border-radius: 18px;
      outline: none;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
      background: #fafafa;
    }

    textarea:focus {
      border-color: #bbbbbb;
      background: #ffffff;
    }

    button {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: #222222;
      color: #ffffff;
      cursor: pointer;
      font-size: 16px;
    }

    button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .empty {
      margin: auto;
      text-align: center;
      color: #999999;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      .app {
        max-width: none;
      }

      .bubble {
        max-width: 84%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="header-left">

      <div class="avatar">
        W
      </div>

      <div>

        <div class="name">
          웬즈데이
        </div>

        <div class="status">
          당신의 AI 친구
        </div>

      </div>

    </div>

    <div
      class="affection"
      id="affection"
    >
      친밀도 0
    </div>

  </header>


  <main
    class="chat"
    id="chat"
  >

    <div
      class="empty"
      id="empty"
    >
      잠깐만요.<br />
      대화를 불러오는 중이에요.
    </div>

  </main>


  <form
    class="composer"
    id="composer"
  >

    <textarea
      id="input"
      placeholder="메시지를 입력하세요..."
      rows="1"
    ></textarea>

    <button
      id="send"
      type="submit"
    >
      ↑
    </button>

  </form>

</div>


<script>

const API =
  "https://my-ai-friend-api.juntheguest.workers.dev";


const chat =
  document.getElementById("chat");

const input =
  document.getElementById("input");

const send =
  document.getElementById("send");

const composer =
  document.getElementById("composer");

const empty =
  document.getElementById("empty");

const affection =
  document.getElementById("affection");


let waiting = false;

let waitingTimer = null;


function removeEmpty() {

  if (empty) {
    empty.remove();
  }

}


function scrollBottom() {

  requestAnimationFrame(() => {

    chat.scrollTop =
      chat.scrollHeight;

  });

}


function addMessage(
  role,
  content,
  proactive = false
) {

  removeEmpty();

  const row =
    document.createElement("div");

  row.className =
    `message-row ${role}`;


  if (role === "assistant") {

    const wrap =
      document.createElement("div");

    wrap.className =
      "assistant-wrap";


    if (proactive) {

      const label =
        document.createElement("div");

      label.className =
        "proactive-label";

      label.textContent =
        "웬즈데이가 먼저 보냄";

      wrap.appendChild(label);

    }


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";

    bubble.textContent =
      content;

    wrap.appendChild(bubble);

    row.appendChild(wrap);

  } else {

    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";

    bubble.textContent =
      content;

    row.appendChild(bubble);

  }


  chat.appendChild(row);

  scrollBottom();

}


function showTyping() {

  hideTyping();


  const row =
    document.createElement("div");

  row.className =
    "message-row assistant";

  row.id =
    "typing-row";


  const wrap =
    document.createElement("div");

  wrap.className =
    "assistant-wrap";


  const typing =
    document.createElement("div");

  typing.className =
    "typing show";


  typing.innerHTML = `
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  `;


  wrap.appendChild(typing);

  row.appendChild(wrap);

  chat.appendChild(row);

  scrollBottom();

}


function hideTyping() {

  const typing =
    document.getElementById(
      "typing-row"
    );

  if (typing) {
    typing.remove();
  }

}


function updateAffection(value) {

  if (
    typeof value !==
    "number"
  ) {
    return;
  }


  affection.textContent =
    `친밀도 ${value.toLocaleString()}`;

}


async function loadHistory() {

  try {

    const response =
      await fetch(
        `${API}/history`
      );


    if (!response.ok) {
      throw new Error(
        "history failed"
      );
    }


    const data =
      await response.json();


    chat.innerHTML = "";


    const messages =
      data.messages || [];


    if (
      messages.length === 0
    ) {

      const welcome =
        document.createElement(
          "div"
        );

      welcome.className =
        "empty";

      welcome.textContent =
        "이제 이야기를 시작해볼까요?";

      chat.appendChild(welcome);

    } else {

      for (
        const message
        of messages
      ) {

        addMessage(

          message.role === "user"
            ? "user"
            : "assistant",

          message.content,

          Boolean(
            message.proactive
          )

        );

      }

    }


    if (data.state) {

      updateAffection(

        Number(
          data.state.affection ||
          0
        )

      );

    }


    scrollBottom();


  } catch (error) {

    chat.innerHTML = "";


    const errorBox =
      document.createElement(
        "div"
      );

    errorBox.className =
      "empty";

    errorBox.textContent =
      "대화를 불러오지 못했어요.";

    chat.appendChild(
      errorBox
    );


    console.error(error);

  }

}


function getNaturalDelay(
  text
) {

  const length =
    text.length;

  let min;
  let max;


  if (length < 15) {

    min = 700;
    max = 1800;

  } else if (
    length < 40
  ) {

    min = 900;
    max = 2400;

  } else if (
    length < 100
  ) {

    min = 1300;
    max = 3200;

  } else {

    min = 1700;
    max = 4200;

  }


  return Math.floor(

    Math.random() *
      (max - min + 1)

  ) + min;

}


async function sendMessage(
  message
) {

  if (
    !message ||
    waiting
  ) {
    return;
  }


  waiting = true;

  send.disabled = true;

  input.disabled = true;


  addMessage(
    "user",
    message
  );


  showTyping();


  try {

    const response =
      await fetch(
        `${API}/chat`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message
            })
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "server error"
      );

    }


    /*
      /redsun을 실행해도
      현재 화면의 대화는
      삭제하지 않습니다.

      DB만 초기화됩니다.
    */

    if (data.reset) {

      hideTyping();

      updateAffection(0);

      addMessage(
        "assistant",
        data.reply
      );

      return;

    }


    const reply =
      String(
        data.reply || ""
      ).trim();


    if (!reply) {

      throw new Error(
        "empty reply"
      );

    }


    updateAffection(

      Number(
        data.affection || 0
      )

    );


    const delay =
      getNaturalDelay(
        reply
      );


    await new Promise(
      resolve => {

        waitingTimer =
          setTimeout(
            resolve,
            delay
          );

      }
    );


    hideTyping();


    addMessage(
      "assistant",
      reply
    );


  } catch (error) {

    hideTyping();


    addMessage(

      "assistant",

      "잠깐 문제가 생겼어요. 다시 한번 보내주세요."

    );


    console.error(
      error
    );


  } finally {

    waiting = false;

    send.disabled =
      false;

    input.disabled =
      false;

    input.focus();

  }

}


async function checkProactive() {

  try {

    const response =
      await fetch(
        `${API}/proactive`,
        {
          method: "POST"
        }
      );


    if (!response.ok) {
      return;
    }


    const data =
      await response.json();


    if (
      data.sent &&
      data.message
    ) {

      addMessage(

        "assistant",

        data.message,

        true

      );

    }


  } catch (error) {

    console.error(
      "proactive check:",
      error
    );

  }

}


composer.addEventListener(
  "submit",
  event => {

    event.preventDefault();


    const message =
      input.value.trim();


    if (!message) {
      return;
    }


    input.value = "";

    input.style.height =
      "42px";


    sendMessage(
      message
    );

  }
);


input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      composer.requestSubmit();

    }

  }
);


input.addEventListener(
  "input",
  () => {

    input.style.height =
      "auto";


    input.style.height =
      Math.min(
        input.scrollHeight,
        130
      ) + "px";

  }
);


loadHistory();


setInterval(
  checkProactive,
  60 * 1000
);

</script>

</body>
</html>
