<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웬즈데이 - Wednesday</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .app {
      max-width: 600px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 18px;
      background: #fee500;
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      font-size: 12px;
      font-weight: normal;
      margin-top: 4px;
      color: #555;
    }

    .chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 15px;
      display: flex;
    }

    .ai {
      justify-content: flex-start;
    }

    .user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 88%;
      padding: 12px 15px;
      border-radius: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ai .bubble {
      background: #f0f0f0;
    }

    .user .bubble {
      background: #fee500;
    }

    .input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    .input-area input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 20px;
      outline: none;
      font-size: 15px;
    }

    .input-area button {
      border: none;
      background: #fee500;
      border-radius: 20px;
      padding: 0 18px;
      cursor: pointer;
      font-size: 14px;
    }

    .input-area button:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      웬즈데이
      <div class="status">온라인</div>
    </div>

    <div class="chat" id="chat">

      <div class="message ai">
        <div class="bubble">안녕하세요. 저는 웬즈데이입니다.

편하게 말씀해 주세요.</div>
      </div>

    </div>

    <div class="input-area">
      <input
        id="messageInput"
        type="text"
        placeholder="웬즈데이에게 말씀해 주세요..."
        autocomplete="off"
      >

      <button
        id="sendButton"
        onclick="sendMessage()"
      >
        전송
      </button>
    </div>

  </div>


  <script>

    const API_URL =
      "https://my-ai-friend-api.juntheguest.workers.dev/";

    const conversationHistory = [];

    let activeRequest = null;
    let requestSequence = 0;


    /*
      --------------------------------
      기본 유틸리티
      --------------------------------
    */

    function randomBetween(min, max) {
      return Math.floor(
        Math.random() * (max - min + 1)
      ) + min;
    }


    function sleep(ms, signal) {

      return new Promise((resolve, reject) => {

        if (signal && signal.aborted) {
          reject(
            new DOMException(
              "요청이 취소되었습니다.",
              "AbortError"
            )
          );
          return;
        }

        const timer = setTimeout(resolve, ms);

        if (signal) {

          const abortHandler = () => {
            clearTimeout(timer);

            reject(
              new DOMException(
                "요청이 취소되었습니다.",
                "AbortError"
              )
            );
          };

          signal.addEventListener(
            "abort",
            abortHandler,
            { once: true }
          );
        }

      });

    }


    /*
      --------------------------------
      생각하는 시간
      --------------------------------

      항상 똑같이 기다리지 않음.

      가벼운 말
      → 짧게

      중요한 질문
      → 조금 길게

      감정적인 이야기
      → 조금 더 길게
    */

    function getThinkingDelay(message) {

      const text = message.trim();

      const seriousPatterns = [
        "어떻게 생각해",
        "너라면",
        "내가 잘못",
        "그만둘까",
        "헤어질까",
        "결혼",
        "이혼",
        "돈",
        "퇴사",
        "미래",
        "결정",
        "선택",
        "후회",
        "왜 살아",
        "살기 싫",
        "죽고",
        "힘들어",
        "불안해",
        "무서워",
        "걱정돼",
        "속상해"
      ];

      const surprisingPatterns = [
        "솔직히",
        "사실",
        "진짜",
        "너는 나를",
        "나를 어떻게",
        "비밀",
        "고백",
        "좋아해",
        "사랑해",
        "싫어",
        "너라면",
        "기억해"
      ];

      const emotionalPatterns = [
        "화나",
        "짜증",
        "슬퍼",
        "외로",
        "미안",
        "후회",
        "답답",
        "힘들",
        "불안",
        "무서",
        "좋아",
        "사랑"
      ];

      const isSerious =
        seriousPatterns.some(word =>
          text.includes(word)
        );

      const isSurprising =
        surprisingPatterns.some(word =>
          text.includes(word)
        );

      const isEmotional =
        emotionalPatterns.some(word =>
          text.includes(word)
        );


      if (isSerious || isSurprising) {

        return randomBetween(
          1500,
          3000
        );

      }


      if (isEmotional) {

        return randomBetween(
          1200,
          2400
        );

      }


      if (text.length > 100) {

        return randomBetween(
          900,
          1800
        );

      }


      if (text.length > 50) {

        return randomBetween(
          650,
          1400
        );

      }


      /*
        짧은 대화는 너무 오래 기다리지 않음.
      */

      return randomBetween(
        400,
        1100
      );

    }


    /*
      --------------------------------
      현재 요청 취소
      --------------------------------
    */

    function cancelActiveRequest() {

      if (!activeRequest) {
        return;
      }

      try {

        activeRequest.controller.abort();

      } catch (error) {

        console.warn(
          "기존 요청 취소 중 오류:",
          error
        );

      }


      if (
        activeRequest.aiMessage &&
        activeRequest.aiMessage.parentNode
      ) {

        activeRequest.aiMessage.remove();

      }


      activeRequest = null;

    }


    /*
      --------------------------------
      AI 말풍선 생성
      --------------------------------
    */

    function createAiMessage(chat) {

      const aiMessage =
        document.createElement("div");

      aiMessage.className =
        "message ai";

      const aiBubble =
        document.createElement("div");

      aiBubble.className =
        "bubble";

      aiMessage.appendChild(
        aiBubble
      );

      /*
        처음에는 안 보임.
        AI 답변이 완성된 후 나타남.
      */

      aiMessage.style.display =
        "none";

      chat.appendChild(
        aiMessage
      );

      return {
        aiMessage,
        aiBubble
      };

    }


    /*
      --------------------------------
      AI 답변을 화면에 표시
      --------------------------------
    */

    function showAiMessage(
      aiMessage,
      aiBubble,
      text
    ) {

      aiBubble.textContent =
        text;

      aiMessage.style.display =
        "flex";

    }


    /*
      --------------------------------
      메인 함수
      --------------------------------
    */

    async function sendMessage() {

      const input =
        document.getElementById(
          "messageInput"
        );

      const chat =
        document.getElementById(
          "chat"
        );

      const message =
        input.value.trim();


      if (message === "") {
        return;
      }


      /*
        이전 AI가 아직 답변 중이면
        그 요청을 취소.
      */

      if (activeRequest) {
        cancelActiveRequest();
      }


      requestSequence++;

      const currentRequestId =
        requestSequence;


      /*
        사용자 메시지 표시
      */

      const userMessage =
        document.createElement("div");

      userMessage.className =
        "message user";


      const userBubble =
        document.createElement("div");

      userBubble.className =
        "bubble";

      userBubble.textContent =
        message;


      userMessage.appendChild(
        userBubble
      );

      chat.appendChild(
        userMessage
      );


      input.value = "";

      input.focus();

      chat.scrollTop =
        chat.scrollHeight;


      /*
        대화 기록에 저장
      */

      conversationHistory.push({
        role: "user",
        content: message
      });


      /*
        AI 말풍선은 아직 숨김.
      */

      const {
        aiMessage,
        aiBubble
      } = createAiMessage(chat);


      const controller =
        new AbortController();


      activeRequest = {
        id: currentRequestId,
        controller,
        aiMessage
      };


      try {

        /*
          Worker 요청
        */

        const response =
          await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                message,

                /*
                  지금 방금 보낸 메시지는
                  Worker가 message로 따로 받으므로
                  history에는 넣지 않음.
                */

                history:
                  conversationHistory.slice(
                    0,
                    -1
                  )

              }),

              signal:
                controller.signal
            }
          );


        if (
          currentRequestId !==
          requestSequence
        ) {
          return;
        }


        if (!response.ok) {

          const errorText =
            await response.text();

          throw new Error(
            errorText ||
            `HTTP ${response.status}`
          );

        }


        if (!response.body) {

          throw new Error(
            "응답을 받을 수 없습니다."
          );

        }


        /*
          --------------------------------
          여기서부터 중요한 부분

          스트리밍 데이터를 받기는 하지만
          화면에는 절대 바로 보여주지 않는다.

          답변 전체를 받을 때까지
          화면은 그대로 유지.
          --------------------------------
        */

        const reader =
          response.body.getReader();

        const decoder =
          new TextDecoder("utf-8");


        let buffer = "";

        let fullReply = "";


        while (true) {

          const result =
            await reader.read();


          if (result.done) {
            break;
          }


          if (
            currentRequestId !==
            requestSequence
          ) {
            return;
          }


          buffer +=
            decoder.decode(
              result.value,
              {
                stream: true
              }
            );


          const lines =
            buffer.split("\n");


          buffer =
            lines.pop() || "";


          for (
            const line of lines
          ) {

            const trimmed =
              line.trim();


            if (!trimmed) {
              continue;
            }


            if (
              !trimmed.startsWith(
                "data:"
              )
            ) {
              continue;
            }


            const data =
              trimmed
                .slice(5)
                .trim();


            if (!data) {
              continue;
            }


            if (
              data === "[DONE]"
            ) {
              continue;
            }


            try {

              const parsed =
                JSON.parse(data);


              const token =
                parsed.response ||
                parsed.choices?.[0]
                  ?.delta
                  ?.content ||
                "";


              if (!token) {
                continue;
              }


              /*
                여기서는 화면에
                절대로 출력하지 않음.

                전부 모아서 하나의 답변으로 만든다.
              */

              fullReply += token;

            } catch (parseError) {

              console.warn(
                "스트림 데이터 처리 오류:",
                parseError
              );

            }

          }

        }


        /*
          --------------------------------
          답변 완성
          --------------------------------
        */

        if (
          currentRequestId !==
          requestSequence
        ) {
          return;
        }


        const finalReply =
          fullReply.trim();


        if (!finalReply) {

          showAiMessage(
            aiMessage,
            aiBubble,
            "음… 잠깐만요."
          );

          return;

        }


        /*
          --------------------------------
          답변을 받은 뒤에도
          바로 보여주지 않고 잠깐 기다림.

          사람이 바로 대답하지 않고
          생각한 뒤 말하는 느낌.
          --------------------------------
        */

        const thinkingDelay =
          getThinkingDelay(message);


        await sleep(
          thinkingDelay,
          controller.signal
        );


        if (
          currentRequestId !==
          requestSequence
        ) {
          return;
        }


        /*
          --------------------------------
          완성된 답변을 한 번에 표시
          --------------------------------
        */

        showAiMessage(
          aiMessage,
          aiBubble,
          finalReply
        );


        chat.scrollTop =
          chat.scrollHeight;


        /*
          완성된 답변만 기억.
        */

        conversationHistory.push({
          role: "assistant",
          content: finalReply
        });


      } catch (error) {

        /*
          사용자가 새 메시지를 보내서
          기존 요청이 취소된 경우에는
          아무것도 표시하지 않음.
        */

        if (
          error.name ===
          "AbortError"
        ) {
          return;
        }


        if (
          currentRequestId !==
          requestSequence
        ) {
          return;
        }


        console.error(error);


        /*
          실패한 사용자 메시지는
          대화 기록에서 제거.
        */

        if (
          conversationHistory.length >
          0 &&
          conversationHistory[
            conversationHistory.length - 1
          ].role === "user"
        ) {

          conversationHistory.pop();

        }


        showAiMessage(
          aiMessage,
          aiBubble,
          "잠깐 문제가 생겼어요.\n조금 있다가 다시 말해 주세요."
        );


      } finally {

        if (
          activeRequest &&
          activeRequest.id ===
          currentRequestId
        ) {

          activeRequest = null;

        }


        input.focus();

        chat.scrollTop =
          chat.scrollHeight;

      }

    }


    /*
      --------------------------------
      Enter 키
      --------------------------------
    */

    document
      .getElementById("messageInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter" &&
            !event.isComposing
          ) {

            event.preventDefault();

            sendMessage();

          }

        }
      );

  </script>

</body>
</html>
