<!DOCTYPE html>

<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웬즈데이 - Wednesday</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .app {
      max-width: 600px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 18px;
      background: #fee500;
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      font-size: 12px;
      font-weight: normal;
      margin-top: 4px;
      color: #555;
    }

    .chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 15px;
      display: flex;
    }

    .ai {
      justify-content: flex-start;
    }

    .user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 90%;
      padding: 12px 15px;
      border-radius: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .ai .bubble {
      background: #f0f0f0;
    }

    .user .bubble {
      background: #fee500;
    }

    .input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    .input-area input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 20px;
      outline: none;
      font-size: 15px;
    }

    .input-area button {
      border: none;
      background: #fee500;
      border-radius: 20px;
      padding: 0 18px;
      cursor: pointer;
      font-size: 14px;
    }

    .input-area button:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>

</head>

<body>

</div>

  <input
    id="messageInput"
    type="text"
    placeholder="웬즈데이에게 말씀해 주세요..."

```

  </div>

  <script>

    const API_URL =
      "https://my-ai-friend-api.juntheguest.workers.dev/";


    /*
      현재 대화의 기록입니다.

      페이지를 새로고침하면 초기화됩니다.
      이후에는 Cloudflare 저장소를 붙여
      장기 기억으로 확장할 수 있습니다.
    */

    const conversationHistory = [];


    async function sendMessage() {

      const input =
        document.getElementById("messageInput");

      const button =
        document.getElementById("sendButton");

      const chat =
        document.getElementById("chat");

      const message =
        input.value.trim();


      if (message === "") {
        return;
      }


      /*
        사용자 메시지 표시
      */

      const userMessage =
        document.createElement("div");

      userMessage.className =
        "message user";


      const userBubble =
        document.createElement("div");

      userBubble.className =
        "bubble";

      userBubble.textContent =
        message;


      userMessage.appendChild(
        userBubble
      );

      chat.appendChild(
        userMessage
      );


      /*
        입력창 초기화
      */

      input.value = "";

      button.disabled = true;


      chat.scrollTop =
        chat.scrollHeight;


      /*
        대화 기록에 사용자 메시지 저장
      */

      conversationHistory.push({
        role: "user",
        content: message
      });


      /*
        웬즈데이 답변 영역 생성
      */

      const aiMessage =
        document.createElement("div");

      aiMessage.className =
        "message ai";


      const aiBubble =
        document.createElement("div");

      aiBubble.className =
        "bubble";

      aiBubble.textContent =
        "작성 중...";


      aiMessage.appendChild(
        aiBubble
      );

      chat.appendChild(
        aiMessage
      );


      chat.scrollTop =
        chat.scrollHeight;


      try {

        /*
          Worker에 현재 메시지와
          이전 대화 기록을 전달합니다.
        */

        const response =
          await fetch(API_URL, {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              message: message,

              history:
                conversationHistory.slice(0, -1)

            })

          });


        /*
          HTTP 오류 처리
        */

        if (!response.ok) {

          const errorText =
            await response.text();

          throw new Error(
            errorText ||
            `HTTP ${response.status}`
          );

        }


        /*
          Worker가 스트리밍 응답을
          반환하는지 확인
        */

        if (!response.body) {

          throw new Error(
            "스트리밍 응답을 받을 수 없습니다."
          );

        }


        const reader =
          response.body.getReader();

        const decoder =
          new TextDecoder("utf-8");


        let buffer = "";

        let fullReply = "";


        /*
          AI가 생성하는 동안
          조금씩 화면에 표시합니다.
        */

        while (true) {

          const result =
            await reader.read();

          if (result.done) {
            break;
          }


          buffer +=
            decoder.decode(
              result.value,
              {
                stream: true
              }
            );


          const lines =
            buffer.split("\n");


          buffer =
            lines.pop() || "";


          for (const line of lines) {

            const trimmed =
              line.trim();


            if (!trimmed) {
              continue;
            }


            if (!trimmed.startsWith("data:")) {
              continue;
            }


            const data =
              trimmed
                .slice(5)
                .trim();


            if (!data) {
              continue;
            }


            if (data === "[DONE]") {
              continue;
            }


            try {

              const parsed =
                JSON.parse(data);


              /*
                Gemma 4 스트리밍 응답의
                새로운 텍스트 조각입니다.
              */

              const token =
                parsed.response ||
                parsed.choices?.[0]?.delta?.content ||
                "";


              if (token) {

                fullReply +=
                  token;


                aiBubble.textContent =
                  fullReply;


                chat.scrollTop =
                  chat.scrollHeight;

              }

            }

            catch (parseError) {

              console.warn(
                "스트림 데이터 처리 오류:",
                parseError,
                data
              );

            }

          }

        }


        /*
          답변이 정상적으로 생성됐다면
          대화 기록에 저장합니다.
        */

        if (fullReply.trim()) {

          conversationHistory.push({
            role: "assistant",
            content: fullReply
          });

        }

        else {

          aiBubble.textContent =
            "죄송합니다. 답변을 받아오지 못했습니다.";

        }


      }

      catch (error) {

        console.error(error);


        /*
          요청에 실패한 사용자 메시지는
          대화 기록에서 제거합니다.
        */

        conversationHistory.pop();


        aiBubble.textContent =
          "현재 웬즈데이와 연결할 수 없습니다.\n" +
          "잠시 후 다시 시도해 주세요.\n\n" +
          "오류: " +
          error.message;

      }


      button.disabled =
        false;


      input.focus();


      chat.scrollTop =
        chat.scrollHeight;

    }


    /*
      Enter 키로 전송
    */

    document
      .getElementById("messageInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter" &&
            !event.isComposing
          ) {

            event.preventDefault();

            sendMessage();

          }

        }
      );

  </script>

</body>
</html>
