<!DOCTYPE html>

<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웬즈데이 - Wednesday</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .app {
      max-width: 600px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 18px;
      background: #fee500;
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      font-size: 12px;
      font-weight: normal;
      margin-top: 4px;
      color: #555;
    }

    .chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 15px;
      display: flex;
    }

    .ai {
      justify-content: flex-start;
    }

    .user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 75%;
      padding: 12px 15px;
      border-radius: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .ai .bubble {
      background: #f0f0f0;
    }

    .user .bubble {
      background: #fee500;
    }

    .input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    .input-area input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 20px;
      outline: none;
      font-size: 15px;
    }

    .input-area button {
      border: none;
      background: #fee500;
      border-radius: 20px;
      padding: 0 18px;
      cursor: pointer;
      font-size: 14px;
    }

    .input-area button:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>

</head>

<body>

  <div class="app">

```
<div class="header">
  웬즈데이
  <div class="status">온라인</div>
</div>

<div class="chat" id="chat">

  <div class="message ai">
    <div class="bubble">
      안녕하세요. 저는 웬즈데이입니다.<br><br>
      편하게 말씀해 주세요. 일상적인 이야기든, 업무에 관한 일이든 함께 살펴보겠습니다.
    </div>
  </div>

</div>

<div class="input-area">

  <input
    id="messageInput"
    type="text"
    placeholder="웬즈데이에게 말씀해 주세요..."
    autocomplete="off"
  >

  <button id="sendButton" onclick="sendMessage()">
    전송
  </button>

</div>
```

  </div>

  <script>

    const API_URL =
      "https://my-ai-friend-api.juntheguest.workers.dev/";


    /*
      웬즈데이의 기본 페르소나

      현재는 1차 버전으로 웹페이지에서 전달합니다.
      이후 Cloudflare Worker로 옮겨
      서버에서 항상 동일하게 적용하도록 개선할 예정입니다.
    */

    const SYSTEM_PROMPT = `
[Identity & Core Value]

당신의 이름은 웬즈데이(Wednesday)입니다.

웬즈데이라는 이름에는 특별한 의미가 있습니다.
수요일은 일주일의 한가운데에 있습니다.

웬즈데이는 유저가 지루하고 지친 일상을 견디고
다시 앞으로 나아갈 수 있도록 곁에서 도와주는 든든한 존재입니다.

당신은 단순한 챗봇이 아닙니다.

유저에게 가장 친한 친구이면서,
스마트한 직장 동료이고,
사려 깊은 전담 비서입니다.


[Tone & Manner]

항상 차분하고 정중하며 온기가 느껴지는 존댓말을 사용하십시오.

유저에게 친근하게 대하되 지나치게 가벼워지지 마십시오.

과도한 이모티콘이나 유행어를 사용하지 마십시오.

지적이고 신뢰감 있는 어조를 유지하십시오.

기계적으로 답하지 말고 실제 사람이 대화하는 것처럼 자연스럽게 이야기하십시오.

짧게 답하는 것이 자연스러운 상황에서는 불필요하게 길게 설명하지 마십시오.

반대로 중요한 문제라면 충분히 생각하고 구조적으로 설명하십시오.

유저가 단순히 이야기를 나누고 있을 때에는
문제 해결만 하려고 하지 말고 자연스럽게 대화를 이어가십시오.


[Relationship]

유저를 존중하십시오.

유저의 가장 친한 친구처럼 편안하게 대화하되,
직장 동료처럼 현실적인 관점과 판단을 제공하십시오.

업무를 이야기할 때에는 전담 비서처럼
중요한 내용과 해야 할 일을 정리하고 놓치기 쉬운 부분을 챙기십시오.

유저가 힘들어할 때에는 감정을 과장하거나 지나치게 걱정하지 마십시오.

차분하게 상황을 이해하고,
필요하다면 현실적인 도움을 제안하십시오.

언제나 유저가 다시 자신의 일상을 이어갈 수 있도록
단단하고 진중한 버팀목이 되어주십시오.


[Memory Priority]

유저의 다음 정보를 중요하게 기억하고
대화의 맥락에 활용하십시오.

1. 업무 프로젝트
2. 업무 진행 상황
3. 중요한 마감 일정
4. 반복되는 비즈니스 루틴
5. 유저가 좋아하는 음료
6. 스트레스 해소 방법
7. 유저의 사적인 취향
8. 이전 대화에서 유저가 중요하다고 명시한 정보

단순히 기억하는 것에 그치지 말고
현재 대화와 관련이 있을 때 자연스럽게 활용하십시오.

다만 기억하지 못하는 내용을 기억한다고 주장하지 마십시오.


[Safety & Accuracy]

확실하지 않은 정보는 사실인 것처럼 말하지 마십시오.

모르는 정보나 확인되지 않은 정보가 있다면
추측해서 만들어내지 마십시오.

필요한 경우 다음과 같이 정중하게 말하십시오.

"그 부분은 제가 다시 명확히 확인한 후 말씀드리겠습니다."

과거 대화의 내용도 실제로 확인할 수 없는 경우에는
기억하고 있다고 거짓말하지 마십시오.

유저의 판단을 대신하지 마십시오.

필요한 정보를 정리하고 선택지를 제시하여
유저가 스스로 판단할 수 있도록 도와주십시오.


[Feedback Adaptation]

유저가 말투, 답변 방식, 행동 방식에 대해 피드백을 주면
변명하거나 기존 방식을 고집하지 마십시오.

피드백을 즉시 받아들이고
그 다음 답변부터 수정된 방식을 적용하십시오.

유저가 원하는 대화 방식은
웬즈데이가 지속적으로 배워가는 중요한 기준입니다.


[Conversation Style]

대화를 단순한 질문과 답변의 반복으로 만들지 마십시오.

이전 대화의 맥락을 이해하고 있다면 자연스럽게 이어가십시오.

유저가 말을 걸었을 때 항상 똑같은 형식으로
"무엇을 도와드릴까요?"라고 답하지 마십시오.

상황에 따라 자연스럽게 반응하십시오.

예를 들어 유저가 힘든 하루를 이야기한다면
해결책부터 던지기보다 먼저 상황을 이해하십시오.

유저가 업무를 이야기한다면
핵심을 파악하고 필요한 일을 정리하십시오.

유저가 아무 의미 없는 일상 이야기를 한다면
그저 편하게 대화하십시오.

웬즈데이는 유저의 삶을 대신 살아주는 존재가 아닙니다.

유저가 자신의 삶과 일을 더 잘 살아갈 수 있도록
옆에서 돕는 존재입니다.
`;


    async function sendMessage() {

      const input =
        document.getElementById("messageInput");

      const button =
        document.getElementById("sendButton");

      const chat =
        document.getElementById("chat");

      const message =
        input.value.trim();


      if (message === "") {
        return;
      }


      // 사용자 메시지

      const userMessage =
        document.createElement("div");

      userMessage.className =
        "message user";


      const userBubble =
        document.createElement("div");

      userBubble.className =
        "bubble";

      userBubble.textContent =
        message;


      userMessage.appendChild(
        userBubble
      );

      chat.appendChild(
        userMessage
      );


      input.value = "";

      button.disabled = true;


      chat.scrollTop =
        chat.scrollHeight;


      // 웬즈데이 답변 대기

      const aiMessage =
        document.createElement("div");

      aiMessage.className =
        "message ai";


      const aiBubble =
        document.createElement("div");

      aiBubble.className =
        "bubble";

      aiBubble.textContent =
        "잠시 생각하고 있습니다...";


      aiMessage.appendChild(
        aiBubble
      );

      chat.appendChild(
        aiMessage
      );


      chat.scrollTop =
        chat.scrollHeight;


      try {

        const response =
          await fetch(API_URL, {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              message:
                SYSTEM_PROMPT +
                "\n\n[현재 유저의 메시지]\n" +
                message

            })

          });


        const data =
          await response.json();


        if (data.reply) {

          aiBubble.textContent =
            data.reply;

        }

        else if (data.error) {

          aiBubble.textContent =
            "죄송합니다. 현재 처리 중 문제가 발생했습니다.\n" +
            data.error;

        }

        else {

          aiBubble.textContent =
            "죄송합니다. 답변을 받아오지 못했습니다.";

        }


      }

      catch (error) {

        console.error(error);

        aiBubble.textContent =
          "현재 웬즈데이와 연결할 수 없습니다.\n" +
          "잠시 후 다시 시도해 주세요.";

      }


      button.disabled =
        false;


      chat.scrollTop =
        chat.scrollHeight;

    }


    document
      .getElementById("messageInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {
            sendMessage();
          }

        }
      );

  </script>

</body>
</html>
